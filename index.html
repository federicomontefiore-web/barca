<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Barca">
<title>Diario di bordo – Manutenzione barca</title>
<link rel="apple-touch-icon" id="appleIcon">
<link rel="icon" id="favIcon">
<link rel="manifest" id="manifestLink">
<style>
/* =========================================================
   COLORI E TEMA
   Navy, bianco e sabbia. Il tema scuro si attiva in automatico
   oppure si sceglie dalle Impostazioni (data-theme).
   ========================================================= */
:root{
  --navy:#0b2545; --navy2:#13406e; --sabbia:#e6d3a3; --sabbia-chiara:#f7efdc;
  --bg:#eef2f7; --card:#ffffff; --testo:#0a1a2f; --muted:#3f5068; --linea:#c9d3e0;
  --ok:#14834a; --check:#c98a00; --ko:#c62828; --nv:#7d8a9c;
  --accento:#13406e; --mare:#d5e6f3; --mare-linea:#b4cfe5; --scafo:#ffffff;
  --coperta:#e9d6a8; --pozzetto:#d7c08a; --tratto:#0b2545; --viva:#8f2d2d;
  --ombra:0 2px 0 rgba(11,37,69,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#071222; --card:#0f2038; --testo:#f1f5fb; --muted:#b3c2d6; --linea:#284062;
    --accento:#7fb3e6; --mare:#0c2a47; --mare-linea:#173d63; --scafo:#1b3557;
    --coperta:#5a4c2f; --pozzetto:#6d5b36; --tratto:#cfe0f3; --viva:#7a2a2a;
    --sabbia-chiara:#2a2416; --ok:#3ccf7d; --check:#f2b81f; --ko:#ff5a52; --nv:#9aa7b8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071222; --card:#0f2038; --testo:#f1f5fb; --muted:#b3c2d6; --linea:#284062;
  --accento:#7fb3e6; --mare:#0c2a47; --mare-linea:#173d63; --scafo:#1b3557;
  --coperta:#5a4c2f; --pozzetto:#6d5b36; --tratto:#cfe0f3; --viva:#7a2a2a;
  --sabbia-chiara:#2a2416; --ok:#3ccf7d; --check:#f2b81f; --ko:#ff5a52; --nv:#9aa7b8;
  color-scheme: dark;
}

/* =========================================================
   BASE: testi grandi (min 17px), pulsanti grandi (min 48px)
   ========================================================= */
*{box-sizing:border-box}
:root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--bg); color:var(--testo);
  font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size:18px; line-height:1.45;
}
h1,h2,h3{ font-family: Georgia, "Times New Roman", serif; font-weight:700; line-height:1.2; }
h2{ font-size:22px; margin:28px 0 12px; }
h3{ font-size:19px; margin:0 0 8px; }
p{ margin:0 0 10px; }
button, input, select, textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--accento); outline-offset:2px; }
.muted{ color:var(--muted); }
.piccolo{ font-size:17px; }

/* Contenitore principale */
#app{ max-width:880px; margin:0 auto; padding:0 14px 120px; }

/* Testata con nome barca e riepilogo */
#top{ position:relative; z-index:5; background:var(--navy); color:#fff;
  margin:0 -14px; padding:12px 16px 12px; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--navy); z-index:10; }
.top-riga{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.titolo-barca{ font-family:Georgia,serif; font-size:23px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chip-ore.errore{ background:var(--ko); border-color:var(--ko); }
.chip-ore{ background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.35); color:#fff;
  border-radius:999px; padding:8px 14px; min-height:44px; font-size:17px; font-weight:600; cursor:pointer; white-space:nowrap; }
.riepilogo{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.riepilogo button{ border:0; border-radius:10px; padding:7px 11px; min-height:42px; font-size:17px; font-weight:700; cursor:pointer;
  background:rgba(255,255,255,.12); color:#fff; display:flex; align-items:center; gap:6px; }
.riepilogo .pallino{ width:14px; height:14px; border-radius:50%; display:inline-block; border:2px solid #fff; }

/* Barra di navigazione in basso (5 voci) */
#nav{ position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--card); border-top:2px solid var(--linea);
  display:flex; justify-content:center; padding-bottom:env(safe-area-inset-bottom,0px); }
#nav .inner{ display:flex; width:100%; max-width:880px; }
#nav button{ flex:1; border:0; background:none; padding:8px 2px 8px; min-height:64px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:2px; font-size:15px; font-weight:600; color:var(--muted); position:relative; }
#nav button .ic{ font-size:25px; line-height:1; }
#nav button.on{ color:var(--accento); }
#nav button.on::before{ content:""; position:absolute; top:-2px; left:20%; right:20%; height:4px; background:var(--accento); border-radius:0 0 4px 4px; }
#nav .badge{ position:absolute; top:4px; right:calc(50% - 26px); background:var(--ko); color:#fff; border-radius:999px; font-size:13px; min-width:22px; height:22px; line-height:22px; padding:0 5px; }

/* Pulsanti */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:10px 18px;
  border-radius:12px; border:2px solid var(--linea); background:var(--card); color:var(--testo);
  font-size:18px; font-weight:700; cursor:pointer; text-align:center; text-decoration:none; }
.btn.primary{ background:var(--navy); border-color:var(--navy); color:#fff; }
:root[data-theme="dark"] .btn.primary{ background:#2d6aa8; border-color:#2d6aa8; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.primary{ background:#2d6aa8; border-color:#2d6aa8; } }
.btn.ok{ background:var(--ok); border-color:var(--ok); color:#fff; }
.btn.danger{ background:var(--ko); border-color:var(--ko); color:#fff; }
.btn.danger-ghost{ border-color:var(--ko); color:var(--ko); }
.btn.warn{ background:var(--check); border-color:var(--check); color:#1a1200; }
.btn.blocco{ display:flex; width:100%; }
.btn:active{ transform:translateY(1px); }
.btn[disabled]{ opacity:.5; }
.fila{ display:flex; gap:10px; flex-wrap:wrap; }
.fila > .btn{ flex:1 1 150px; }

/* Selettori a segmenti (es. Dall'alto / Di lato) */
.seg{ display:flex; border:2px solid var(--navy2); border-radius:12px; overflow:hidden; }
.seg button{ flex:1; border:0; background:var(--card); min-height:50px; font-size:18px; font-weight:700; cursor:pointer; padding:6px 10px; }
.seg button + button{ border-left:2px solid var(--navy2); }
.seg button.on{ background:var(--navy2); color:#fff; }

/* Schede / blocchi */
.card{ background:var(--card); border:1px solid var(--linea); border-radius:14px; padding:16px; margin:12px 0; box-shadow:var(--ombra); }
.card.sabbia{ background:var(--sabbia-chiara); border-color:var(--sabbia); }
.vuoto{ text-align:center; padding:26px 16px; color:var(--muted); }

/* Filtri */
.filtri{ display:flex; gap:8px; overflow-x:auto; padding:4px 0 8px; -webkit-overflow-scrolling:touch; }
.chip{ flex:0 0 auto; border:2px solid var(--linea); background:var(--card); border-radius:999px; padding:6px 14px; min-height:46px;
  font-size:17px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:6px; }
.chip.on{ border-color:var(--navy2); background:var(--navy2); color:#fff; }
select.campo, .chip-select{ min-height:50px; border:2px solid var(--linea); border-radius:12px; background:var(--card); padding:6px 12px; font-size:18px; }

/* ===== Disegno della barca ===== */
.disegno{ background:var(--mare); border-radius:18px; border:2px solid var(--mare-linea); padding:6px; margin:6px 0 10px; position:relative; }
.disegno.lato{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.disegno svg{ display:block; margin:0 auto; width:100%; height:auto; user-select:none; -webkit-user-select:none; }
.disegno.alto svg{ max-height:66vh; width:auto; max-width:100%; }
.disegno.lato svg{ min-width:640px; }
.didascalia{ text-align:center; font-size:17px; color:var(--muted); padding:2px 0 4px; }
.sposta-attivo{ outline:4px dashed var(--check); outline-offset:-4px; }
.avviso{ background:var(--sabbia-chiara); border:2px solid var(--sabbia); border-radius:12px; padding:12px 14px; margin:8px 0; font-weight:600; }

/* Elementi dell'SVG */
svg .mare-griglia{ stroke:var(--mare-linea); stroke-width:1.5; fill:none; }
svg .scafo{ fill:var(--scafo); stroke:var(--tratto); stroke-width:4; stroke-linejoin:round; }
svg .coperta{ fill:var(--coperta); }
svg .tuga{ fill:var(--scafo); stroke:var(--tratto); stroke-width:3; }
svg .pozzetto{ fill:var(--pozzetto); stroke:var(--tratto); stroke-width:2; }
svg .osteriggio{ fill:var(--mare); stroke:var(--tratto); stroke-width:2; }
svg .cavo{ stroke:var(--tratto); stroke-width:2; opacity:.55; }
svg .boma{ stroke:var(--tratto); stroke-width:6; stroke-linecap:round; }
svg .albero{ fill:var(--tratto); stroke:var(--tratto); }
svg .albero-lato{ stroke:var(--tratto); stroke-width:7; stroke-linecap:round; }
svg .scuro{ fill:var(--tratto); }
svg .viva{ fill:var(--viva); }
svg .linea-gall{ stroke:var(--tratto); stroke-width:3; }
svg .etic{ fill:var(--tratto); font-size:17px; font-weight:700; font-family:Georgia,serif; opacity:.8; }
svg .etic-b{ fill:#fff; font-size:15px; font-weight:700; opacity:.9; }

/* Pin dei sistemi */
.pin{ cursor:pointer; }
.pin .pin-hit{ fill:transparent; }
.pin .pin-bg{ fill:var(--card); stroke-width:6; }
.pin .pin-ico{ font-size:23px; pointer-events:none; }
.pin .pin-badge{ stroke:var(--card); stroke-width:2.5; }
.pin .pin-sim{ fill:#fff; font-size:13px; font-weight:900; pointer-events:none; font-family:Arial,sans-serif; }
.pin .pin-nome{ font-size:13px; font-weight:700; fill:var(--testo); stroke:var(--card); stroke-width:4; paint-order:stroke; pointer-events:none; }
.pin.st-ok .pin-bg{ stroke:var(--ok); } .pin.st-ok .pin-badge{ fill:var(--ok); }
.pin.st-check .pin-bg{ stroke:var(--check); } .pin.st-check .pin-badge{ fill:var(--check); }
.pin.st-ko .pin-bg{ stroke:var(--ko); } .pin.st-ko .pin-badge{ fill:var(--ko); }
.pin.st-nv .pin-bg{ stroke:var(--nv); stroke-dasharray:6 4; } .pin.st-nv .pin-badge{ fill:var(--nv); }
.pin.spento{ opacity:.15; }
.sposta-attivo .pin{ touch-action:none; cursor:grab; }
.pin.trascina{ cursor:grabbing; }
.pin.trascina .pin-bg{ stroke-width:9; }
@keyframes pulsa{ 0%,100%{ opacity:1 } 50%{ opacity:.45 } }
.pin.st-ko .pin-badge{ animation:pulsa 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce){ .pin.st-ko .pin-badge{ animation:none; } .sheet{ transition:none!important; } }

/* Righe dell'elenco sistemi */
.riga{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card); border:1px solid var(--linea);
  border-left:8px solid var(--nv); border-radius:12px; padding:12px 14px; margin:8px 0; min-height:64px; cursor:pointer; font-size:18px; }
.riga .ico{ font-size:28px; width:36px; text-align:center; flex:0 0 auto; }
.riga .corpo{ flex:1; min-width:0; }
.riga .nome{ font-weight:700; }
.riga .sotto{ font-size:17px; color:var(--muted); }
.riga .freccia{ font-size:26px; color:var(--muted); }
.riga.st-ok{ border-left-color:var(--ok); } .riga.st-check{ border-left-color:var(--check); }
.riga.st-ko{ border-left-color:var(--ko); } .riga.st-nv{ border-left-color:var(--nv); }
.riga.pri-alta{ border-left-color:var(--ko); } .riga.pri-media{ border-left-color:var(--check); } .riga.pri-bassa{ border-left-color:var(--nv); }
.stato-txt{ font-weight:700; }
.stato-txt.st-ok{ color:var(--ok); } .stato-txt.st-check{ color:var(--check); } .stato-txt.st-ko{ color:var(--ko); } .stato-txt.st-nv{ color:var(--muted); }

/* ===== Pannelli a scorrimento (scheda, moduli) ===== */
.sheet{ position:fixed; inset:0; z-index:20; background:var(--bg); display:flex; flex-direction:column;
  transform:translateY(100%); transition:transform .22s ease-out; padding-top:env(safe-area-inset-top,0px); }
.sheet.aperto{ transform:none; }
.sheet-testa{ display:flex; align-items:center; gap:8px; background:var(--navy); color:#fff; padding:8px 10px; min-height:64px; }
.sheet-testa h2{ margin:0; font-size:21px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.btn-indietro{ border:0; background:rgba(255,255,255,.14); color:#fff; border-radius:10px; min-height:48px; padding:6px 14px; font-size:18px; font-weight:700; cursor:pointer; }
.sheet-corpo{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px 14px calc(40px + env(safe-area-inset-bottom,0px)); }
.sheet-corpo > .stretto{ max-width:760px; margin:0 auto; }

/* Riquadro stato nella scheda */
.stato-box{ border-radius:14px; padding:14px 16px; color:#fff; margin:6px 0 12px; }
.stato-box .grande{ font-size:24px; font-weight:800; font-family:Georgia,serif; }
.stato-box.st-ok{ background:var(--ok); } .stato-box.st-check{ background:var(--check); color:#1a1200; }
.stato-box.st-ko{ background:var(--ko); } .stato-box.st-nv{ background:var(--nv); }
.griglia-stati{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
.griglia-stati button{ min-height:56px; border-radius:12px; border:3px solid var(--linea); background:var(--card); font-size:17px; font-weight:700; cursor:pointer; }
.griglia-stati button.on.st-ok{ border-color:var(--ok); background:color-mix(in srgb, var(--ok) 18%, var(--card)); }
.griglia-stati button.on.st-check{ border-color:var(--check); background:color-mix(in srgb, var(--check) 22%, var(--card)); }
.griglia-stati button.on.st-ko{ border-color:var(--ko); background:color-mix(in srgb, var(--ko) 18%, var(--card)); }
.griglia-stati button.on.st-nv{ border-color:var(--nv); background:color-mix(in srgb, var(--nv) 22%, var(--card)); }

/* Dati in elenco */
dl.dati{ display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0; }
dl.dati dt{ color:var(--muted); }
dl.dati dd{ margin:0; font-weight:600; word-break:break-word; }

/* Moduli */
label.et{ display:block; font-weight:700; margin:16px 0 6px; }
.campo{ width:100%; min-height:52px; border:2px solid var(--linea); border-radius:12px; background:var(--card); padding:10px 12px; font-size:18px; }
textarea.campo{ min-height:96px; resize:vertical; }
.campo:focus{ border-color:var(--accento); outline:none; }
.due{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.due label.et{ margin-top:12px; }
.check-riga{ display:flex; align-items:center; gap:12px; min-height:52px; font-weight:600; margin:12px 0; cursor:pointer; }
.check-riga input{ width:28px; height:28px; accent-color:var(--navy2); flex:0 0 auto; }
.scelta{ display:flex; gap:8px; flex-wrap:wrap; }
.scelta button{ flex:1 1 120px; min-height:52px; border-radius:12px; border:3px solid var(--linea); background:var(--card); font-size:17px; font-weight:700; cursor:pointer; padding:6px 8px; }
.scelta button.on{ border-color:var(--navy2); background:color-mix(in srgb, var(--navy2) 15%, var(--card)); }
.griglia-icone{ display:grid; grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:6px; }
.griglia-icone button{ min-height:52px; font-size:26px; border-radius:10px; border:2px solid var(--linea); background:var(--card); cursor:pointer; }
.griglia-icone button.on{ border:3px solid var(--navy2); }
.barra-salva{ position:sticky; bottom:-40px; background:linear-gradient(transparent, var(--bg) 30%); padding:18px 0 20px; margin-top:16px; }

/* Catalogo */
.cat-titolo{ display:flex; align-items:center; gap:8px; font-family:Georgia,serif; font-size:20px; font-weight:700; margin:22px 0 8px; }
.cat-griglia{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
.cat-voce{ display:flex; align-items:center; gap:10px; text-align:left; min-height:60px; padding:8px 12px; border-radius:12px; border:2px solid var(--linea); background:var(--card); cursor:pointer; font-size:17px; font-weight:600; }
.cat-voce .ico{ font-size:26px; }
.cat-voce .gia{ display:block; font-size:15px; color:var(--ok); font-weight:700; }

/* Foto */
.foto-griglia{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; margin:8px 0; }
.foto-griglia button{ padding:0; border:2px solid var(--linea); border-radius:10px; overflow:hidden; aspect-ratio:1; background:var(--linea); cursor:pointer; }
.foto-griglia img{ width:100%; height:100%; object-fit:cover; display:block; }
.visore{ position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.92); display:flex; flex-direction:column; padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px)); }
.visore img{ flex:1; min-height:0; object-fit:contain; width:100%; }
.visore .fila{ margin-top:10px; }

/* Interventi nel registro */
.intervento{ display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--linea); border-radius:12px; padding:12px 14px; margin:8px 0; cursor:pointer; font-size:18px; }
.intervento .testa{ display:flex; justify-content:space-between; gap:10px; font-weight:700; }
.tipo{ display:inline-block; font-size:15px; font-weight:800; padding:2px 9px; border-radius:6px; margin:4px 0; background:var(--sabbia-chiara); border:1px solid var(--sabbia); }
.tipo.t-Guasto{ background:var(--ko); color:#fff; border-color:var(--ko); }
.tipo.t-Riparazione{ background:color-mix(in srgb, var(--check) 30%, var(--card)); border-color:var(--check); }
.tabella{ width:100%; border-collapse:collapse; font-size:18px; }
.tabella td,.tabella th{ padding:8px 6px; border-bottom:1px solid var(--linea); text-align:left; }
.tabella td.num,.tabella th.num{ text-align:right; }

/* Ore motore */
.ore-grande{ font-family:Georgia,serif; font-size:56px; font-weight:800; line-height:1.1; }
.campo-ore{ font-size:34px; font-weight:800; text-align:center; min-height:72px; }

/* Finestre di conferma e avvisi */
.dlg-sfondo{ position:fixed; inset:0; z-index:50; background:rgba(4,12,24,.6); display:flex; align-items:center; justify-content:center; padding:18px; }
.dlg{ background:var(--card); border-radius:16px; padding:20px; max-width:440px; width:100%; font-size:19px; }
.dlg p{ margin-bottom:16px; }
.dlg .bottoni{ display:flex; flex-direction:column; gap:10px; }
.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:60; background:var(--navy); color:#fff;
  padding:14px 20px; border-radius:12px; font-size:18px; font-weight:600; max-width:92vw; box-shadow:0 6px 20px rgba(0,0,0,.3); text-align:center; }

/* Benvenuto */
.benvenuto{ max-width:520px; margin:0 auto; padding:30px 4px 60px; }
.benvenuto .logo{ font-size:64px; text-align:center; }
.benvenuto h1{ font-size:36px; text-align:center; margin:4px 0 6px; }
.benvenuto .sotto{ text-align:center; color:var(--muted); margin-bottom:18px; }

/* =========================================================
   VERSIONE PC / TABLET ORIZZONTALE (schermi da 1000px in su)
   Menu laterale, disegno e elenco affiancati, pannelli a destra.
   ========================================================= */
.nav-marchio{ display:none; }
#velo{ display:none; }
.colonna-stretta{ max-width:640px; }
@media (hover:hover){
  .riga:hover, .intervento:hover, .cat-voce:hover{ border-color:var(--accento); }
  .btn:hover{ filter:brightness(1.06); }
  .chip:hover:not(.on), .seg button:hover:not(.on){ background:color-mix(in srgb, var(--accento) 10%, var(--card)); }
}
@media (min-width:1000px){
  body{ padding-left:230px; }
  #app{ max-width:1400px; padding:0 32px 48px; }
  #top{ margin:0 -32px; padding:16px 32px; display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
  #top .top-riga{ flex:0 0 auto; gap:18px; }
  #top .riepilogo{ margin-top:0; flex:1; justify-content:flex-end; }
  #nav{ top:0; bottom:0; right:auto; width:230px; border-top:0; border-right:2px solid var(--linea); padding:0; }
  #nav .inner{ flex-direction:column; padding-top:env(safe-area-inset-top,0px); }

/* ---------- Database (IndexedDB) ---------- */
const DB = {
  db: null,
  apri(){
    return new Promise((ok, ko) => {
      if (!("indexedDB" in window)) return ko(new Error("IndexedDB non disponibile"));
      const r = indexedDB.open("diarioBordoBarca", 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("dati"); d.createObjectStore("foto"); };
      r.onsuccess = () => { this.db = r.result; ok(); };
      r.onerror = () => ko(r.error);
    });
  },
  leggi(store, chiave){
    return new Promise((ok, ko) => {
      if (!this.db) return ok(undefined);
      const r = this.db.transaction(store).objectStore(store).get(chiave);
      r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
    });
  },
  scrivi(store, chiave, valore){ return this.molti(store, [[chiave, valore]]); },
  molti(store, coppie){
    return new Promise((ok, ko) => {
      if (!this.db) return ok();
      const t = this.db.transaction(store, "readwrite"), s = t.objectStore(store);
      coppie.forEach(([k, v]) => s.put(v, k));
      t.oncomplete = () => ok(); t.onerror = () => ko(t.error); t.onabort = () => ko(t.error || new Error("Scrittura interrotta"));
    });
  },
  elimina(store, chiavi){
    return new Promise((ok, ko) => {
      if (!this.db || !chiavi.length) return ok();
      const t = this.db.transaction(store, "readwrite"), s = t.objectStore(store);
      chiavi.forEach(k => s.delete(k));
      t.oncomplete = () => ok(); t.onerror = () => ko(t.error);
    });
  },
  svuota(store){
    return new Promise((ok, ko) => {
      if (!this.db) return ok();
      const t = this.db.transaction(store, "readwrite"); t.objectStore(store).clear();
      t.oncomplete = () => ok(); t.onerror = () => ko(t.error);
    });
  },
  chiavi(store){
    return new Promise((ok, ko) => {
      if (!this.db) return ok(new Set());
      const r = this.db.transaction(store).objectStore(store).getAllKeys();
      r.onsuccess = () => ok(new Set(r.result)); r.onerror = () => ko(r.error);
    });
  },
  tutte(store){
    return new Promise((ok, ko) => {
      if (!this.db) return ok({});
      const out = {}, r = this.db.transaction(store).objectStore(store).openCursor();

function salvaOra(){
  clearTimeout(timerSalva);

/* Garantisce che i dati abbiano tutti i campi (anche da backup vecchi) */

    s.foto = s.foto || [];

  });
  d.interventi.forEach(i => { i.fotoPrima = i.fotoPrima || []; i.fotoDopo = i.fotoDopo || []; });
  return d;
}

/* ---------- Calcoli: scadenze e stato effettivo ---------- */
const trova = id => S.sistemi.find(s => s.id === id);
function scadenza(s){
  const m = s.manutenzione; if (!m) return null;
  const mesi = Number(m.mesi) || 0, ore = Number(m.ore) || 0;
  if (!mesi && !ore) return null;
  const r = { giorni:null, data:null, ore:null, oreMancanti:null, manca:false };
  if (mesi){ if (m.ultimaData){ r.data = aggiungiMesi(m.ultimaData, mesi); r.giorni = giorniTra(r.data, oggi()); } else r.manca = true; }
  if (ore){ if (m.ultimeOre !== "" && m.ultimeOre != null){ r.ore = Number(m.ultimeOre) + ore; r.oreMancanti = r.ore - (Number(S.barca.oreMotore) || 0); } else r.manca = true; }
  r.imminente = (r.giorni != null && r.giorni <= 30) || (r.oreMancanti != null && r.oreMancanti <= 20);
  r.scaduta = (r.giorni != null && r.giorni < 0) || (r.oreMancanti != null && r.oreMancanti < 0);
  r.urgenza = Math.min(r.giorni ?? 1e9, r.oreMancanti ?? 1e9);
  if (r.giorni == null && r.oreMancanti == null) return r.manca ? r : null;
  return r;
}
function effStato(s){
  if (s.stato === "ko") return "ko";
  const sc = scadenza(s);
  if (sc && sc.imminente) return "check";
  return s.stato || "nv";
}
function testoScadenza(sc){
  if (!sc) return "";
  const p = [];
  if (sc.giorni != null){
    if (sc.giorni < 0) p.push(`scaduta da ${-sc.giorni} giorni`);
    else if (sc.giorni === 0) p.push("scade oggi");
    else if (sc.giorni <= 45) p.push(`tra ${sc.giorni} giorni`);
    else p.push(`il ${fmtData(sc.data)}`);
  }
  if (sc.oreMancanti != null){
    if (sc.oreMancanti < 0) p.push(`superata di ${fmtOre(-sc.oreMancanti)} ore`);
    else p.push(`tra ${fmtOre(sc.oreMancanti)} ore motore`);
  }
  if (!p.length && sc.manca) return "inserisci la data dell'ultimo intervento";
  return p.join(" oppure ");
}
function riepilogo(){
  const r = { ok:0, check:0, ko:0, nv:0, scad:0 };
  S.sistemi.forEach(s => { r[effStato(s)]++; const sc = scadenza(s); if (sc && sc.imminente) r.scad++; });
  return r;
}
function passaFiltro(s){
  if (filtroStato !== "tutti" && effStato(s) !== filtroStato) return false;
  if (filtroCat !== "tutte" && s.categoria !== filtroCat) return false;
  return true;
}
const ordineStato = { ko:0, check:1, nv:2, ok:3 };

/* ---------- Creazione sistemi ---------- */
function vocecatalogo(cat, id){ return (CATALOGO[cat] || []).find(v => v[0] === id); }
function posizioniIniziali(cat, voce, dati){
  const c = CATEGORIE[cat] || CATEGORIE.altro, sp = (voce && voce[5]) || {};
  const quanti = ((dati || S) ? (dati || S).sistemi.filter(s => s.categoria === cat).length : 0);
  const dx = ((quanti % 5) - 2) * 34 * (quanti ? 1 : 0), dy = Math.floor(quanti / 5) * 44;
  const a = sp.alto || c.alto, l = sp.lato || c.lato;
  const lim = (v, mi, ma) => Math.max(mi, Math.min(ma, v));
  return { alto:{ x:lim(a[0] + (sp.alto ? 0 : dx), 30, 370), y:lim(a[1] + (sp.alto ? 0 : dy), 30, 880) },

}

/* Trascinamento dei pin (touch e mouse) */
function collegaSvg(){
  const svg = $("#svgBarca"); if (!svg) return;
  let drag = null;
  const punto = e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
  const vb = svg.viewBox.baseVal;
  svg.addEventListener("pointerdown", e => {
    const pin = e.target.closest(".pin"); if (!pin) return;
    drag = { id:pin.dataset.id, pin, x0:e.clientX, y0:e.clientY, mosso:false, k: vistaDisegno === "alto" ? 1 : 1.15 };
    if (modoSposta){ e.preventDefault(); try { pin.setPointerCapture(e.pointerId); } catch(_){} pin.classList.add("trascina"); }
  });
  svg.addEventListener("pointermove", e => {
    if (!drag || !modoSposta) return;
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 6) drag.mosso = true;
    if (!drag.mosso) return;
    const p = punto(e);
    drag.x = Math.max(20, Math.min(vb.width - 20, p.x)); drag.y = Math.max(20, Math.min(vb.height - 20, p.y));
    drag.pin.setAttribute("transform", `translate(${drag.x},${drag.y}) scale(${drag.k})`);
  });
  const fine = e => {
    if (!drag) return;
    const d = drag; drag = null; d.pin.classList.remove("trascina");
    if (e.type === "pointercancel") return;
    if (modoSposta && d.mosso){
      const s = trova(d.id); if (s){ s.pos[vistaDisegno] = { x:Math.round(d.x), y:Math.round(d.y) }; salva(); }
    } else if (!d.mosso){ apriScheda(d.id); }
  };
  svg.addEventListener("pointerup", fine);
  svg.addEventListener("pointercancel", fine);
}

/* =========================================================
   PANNELLI (scheda sistema, moduli) con tasto Indietro
   ========================================================= */
function apriSheet(renderFn, opts = {}){
  const el = document.createElement("section"); el.className = "sheet"; el.setAttribute("role", "dialog");
  document.body.appendChild(el);
  const sh = { el, renderFn, opts, pushed:false };
  sheets.push(sh); aggiornaVelo();
  try { history.pushState({ sheet:sheets.length }, ""); sh.pushed = true; } catch(_){}
  disegnaSheet(sh);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("aperto")));
  return sh;
}
function disegnaSheet(sh){
  const r = sh.renderFn(sh);
  if (!r){ rimuoviSheet(sh); return; }
  const vecchio = sh.el.querySelector(".sheet-corpo"), scroll = vecchio ? vecchio.scrollTop : 0;
  sh.el.innerHTML = `<header class="sheet-testa"><button class="btn-indietro" data-act="chiudi">‹ Indietro</button><h2>${r.titolo}</h2></header>
    <div class="sheet-corpo"><div class="stretto">${r.html}</div></div>`;
  sh.el.querySelector(".sheet-corpo").scrollTop = scroll;
  if (r.monta) r.monta(sh.el);
  idrataFoto(sh.el);
}
function rimuoviSheet(sh){
  const i = sheets.indexOf(sh); if (i < 0) return;
  sheets.splice(i, 1); aggiornaVelo();
  if (sh.opts.allaChiusura) sh.opts.allaChiusura();
  sh.el.classList.remove("aperto");
  setTimeout(() => sh.el.remove(), 230);
  aggiornaTutto();
}
function aggiornaVelo(){ $("#velo").classList.toggle("on", sheets.length > 0); }
$("#velo").addEventListener("click", () => chiudiTop());
/* Su PC: Esc chiude foto, finestre e pannelli */
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($(".dlg-sfondo")) return;
  if ($(".visore")){ history.back(); return; }
  if (sheets.length) chiudiTop();
});
function chiudiTop(){
  const sh = sheets[sheets.length - 1]; if (!sh) return;
  if (sh.pushed){ history.back(); } else rimuoviSheet(sh);
}
window.addEventListener("popstate", () => {
  const v = $(".visore"); if (v){ v.remove(); return; }
  const sh = sheets[sheets.length - 1]; if (sh && sh.pushed) rimuoviSheet(sh);
});
/* Sostituisce il pannello in cima senza toccare la cronologia */
function sostituisciTop(renderFn, opts = {}){
  const vecchio = sheets.pop();
  if (vecchio){ vecchio.el.remove(); if (vecchio.opts.allaChiusura) vecchio.opts.allaChiusura(); }
  const el = document.createElement("section"); el.className = "sheet aperto"; el.setAttribute("role", "dialog");
  document.body.appendChild(el);
  const sh = { el, renderFn, opts, pushed: vecchio ? vecchio.pushed : false };
  sheets.push(sh); disegnaSheet(sh); return sh;
}

/* ---------- Finestre di dialogo e messaggi ---------- */
function dialogo(msg, bottoni){
  return new Promise(ok => {
    const d = document.createElement("div"); d.className = "dlg-sfondo";
    d.innerHTML = `<div class="dlg" role="alertdialog"><p>${msg}</p><div class="bottoni">${bottoni.map((b, i) => `<button class="btn ${b.cls || ""}" data-i="${i}">${b.t}</button>`).join("")}</div></div>`;
    d.addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b){ d.remove(); ok(bottoni[+b.dataset.i].v); } });
    document.body.appendChild(d); d.querySelector("button").focus();
  });
}
const conferma = (msg, si = "Elimina", cls = "danger") => dialogo(msg, [{ t:si, v:true, cls }, { t:"Annulla", v:false }]);
const avviso = msg => dialogo(msg, [{ t:"Ho capito", v:true, cls:"primary" }]);
let timerToast = null;
function toast(msg){
  let t = $(".toast"); if (!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.innerHTML = msg; clearTimeout(timerToast); timerToast = setTimeout(() => t.remove(), 2800);
}

/* =========================================================
   FOTO: compressione, salvataggio, visualizzazione
   ========================================================= */
function comprimiFoto(file){
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1280, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error("Questa immagine non si può leggere")); };
    img.src = url;
  });
}
/* Apre fotocamera/galleria e restituisce gli id delle foto salvate */
function scegliFoto(){
  return new Promise(ok => {
    const inp = $("#fileFoto"); inp.value = "";
    inp.onchange = async () => {
      const files = Array.from(inp.files || []); if (!files.length) return ok([]);
      toast("📷 Salvo le foto…");
      const ids = [];
      for (const f of files){
        try {
          const dati = await comprimiFoto(f), id = "f_" + uid();
          await DB.scrivi("foto", id, dati); fotoCache.set(id, dati); ids.push(id);
        } catch(e){ erroreMemoria(e); break; }
      }
      ok(ids);
    };
    inp.click();
  });
}
function grigliaFoto(ids, ctx){
  return `<div class="foto-griglia">${ids.map(id => `<button data-act="vediFoto" data-foto-id="${id}" data-ctx="${ctx}" aria-label="Apri foto"><img data-foto="${id}" alt=""></button>`).join("")}</div>`;
}
async function idrataFoto(root){
  for (const img of $$("img[data-foto]", root)){
    if (img.src) continue;
    const id = img.dataset.foto;
    let d = fotoCache.get(id);
    if (!d){ try { d = await DB.leggi("foto", id); if (d) fotoCache.set(id, d); } catch(_){} }
    if (!d) d = await scaricaFoto(id);
    if (d) img.src = d;
  }
}
/* Visore a schermo intero, con eventuale tasto Elimina */
function apriVisore(id, onElimina){
  const v = document.createElement("div"); v.className = "visore";
  v.innerHTML = `<img alt="Foto" src="${fotoCache.get(id) || ""}">
    <div class="fila">${onElimina ? `<button class="btn danger" data-v="del">🗑️ Elimina foto</button>` : ""}<button class="btn primary" data-v="chiudi">Chiudi</button></div>`;
  if (!fotoCache.get(id)) DB.leggi("foto", id).then(d => { if (d){ fotoCache.set(id, d); v.querySelector("img").src = d; } });
  let pushed = false; try { history.pushState({ visore:1 }, ""); pushed = true; } catch(_){}
  const chiudi = () => { if (pushed) history.back(); else v.remove(); };
  v.addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.v === "chiudi") chiudi();
    if (b.dataset.v === "del" && await conferma("Eliminare questa foto?")){ chiudi(); onElimina(); }
  });
  document.body.appendChild(v);
}

/* =========================================================

function apriCatalogo(){
  apriSheet(() => ({
    titolo:"Aggiungi sistema",

          h += `<div class="cat-titolo">${CATEGORIE[cat].icona} ${CATEGORIE[cat].nome}</div><div class="cat-griglia">${v.map(x => {

function aggiungiDaCatalogo(cat, id){

/* =========================================================
   SCHEDA DEL SISTEMA
   ========================================================= */
function apriScheda(id){ apriSheet(renderScheda(id), { vivo:true }); }
function renderScheda(id){
  return () => {
    const s = trova(id); if (!s) return null;
    const st = effStato(s), sc = scadenza(s), m = s.manutenzione;
    const storico = S.interventi.filter(i => i.sistemaId === id).sort((a, b) => b.data.localeCompare(a.data));
    const todo = S.daFare.filter(t => t.sistemaId === id && !t.fatto);
    const spesa = storico.reduce((t, i) => t + (Number(i.costo) || 0), 0);
    const dato = (k, v) => v !== "" && v != null ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : "";
    let manHtml;
    if (!Number(m.mesi) && !Number(m.ore)) manHtml = `<p class="muted">Nessuna manutenzione programmata.</p>`;
    else {
      const ogni = [Number(m.mesi) ? `ogni ${m.mesi} mesi` : "", Number(m.ore) ? `ogni ${m.ore} ore motore` : ""].filter(Boolean).join(" oppure ");
      manHtml = `<p>Da fare <b>${ogni}</b>.</p>
        <p>Ultima volta: <b>${m.ultimaData ? fmtData(m.ultimaData) : "—"}</b>${m.ultimeOre !== "" ? ` a <b>${fmtOre(m.ultimeOre)} h</b>` : ""}</p>
        ${sc ? `<p style="font-size:20px">${sc.imminente ? "⚠️" : "📅"} Prossima: <b>${testoScadenza(sc)}</b></p>` : ""}
        ${sc && sc.manca ? `<p class="muted piccolo">Per calcolare la scadenza inserisci ${!m.ultimaData && Number(m.mesi) ? "la data" : ""}${!m.ultimaData && Number(m.mesi) && m.ultimeOre === "" && Number(m.ore) ? " e " : ""}${m.ultimeOre === "" && Number(m.ore) ? "le ore motore" : ""} dell'ultimo intervento.</p>` : ""}`;
    }
    return {
      titolo:`${esc(s.icona)} ${esc(s.nome)}`,
      html:`
        <div class="stato-box st-${st}">
          <div class="grande">${STATI[st].em} ${STATI[st].nome}</div>
          <div>${s.ultimaVerifica ? "Ultima verifica: " + fmtData(s.ultimaVerifica) : "Mai verificato"}${st === "check" && s.stato !== "check" ? "<br>Manutenzione in scadenza" : ""}</div>
        </div>
        <button class="btn ok blocco" data-act="verificato" data-id="${id}">✓ Verificato oggi: funziona</button>
        <p class="muted piccolo" style="margin:14px 0 0">Oppure scegli lo stato:</p>
        <div class="griglia-stati">${Object.keys(STATI).map(k => `<button class="st-${k} ${s.stato === k ? "on" : ""}" data-act="setStato" data-id="${id}" data-v="${k}">${STATI[k].em} ${STATI[k].nome}</button>`).join("")}</div>
        <div class="fila">
          <button class="btn primary" data-act="nuovoIntervento" data-id="${id}">🛠️ Registra intervento</button>
          <button class="btn" data-act="nuovoTodo" data-id="${id}">📝 Lavoro da fare</button>
        </div>

        <div class="card"><h3>📅 Manutenzione programmata</h3>${manHtml}
          <button class="btn blocco" data-act="modificaSistema" data-id="${id}">Imposta intervallo</button></div>

        ${todo.length ? `<h2>Lavori da fare</h2>${todo.map(rigaTodo).join("")}` : ""}

        <div class="card"><h3>📷 Foto</h3>
          ${s.foto.length ? grigliaFoto(s.foto, "sis:" + id) : `<p class="muted">Nessuna foto. Utile fotografare targhetta e matricola.</p>`}
          <button class="btn blocco" data-act="fotoSistema" data-id="${id}">📷 Aggiungi foto</button></div>

        <div class="card"><h3>Dati</h3>
          <dl class="dati">
            ${dato("Categoria", (CATEGORIE[s.categoria] || CATEGORIE.altro).nome)}
            ${dato("Marca", s.marca)}${dato("Modello", s.modello)}${dato("Matricola", s.matricola)}${dato("Anno", s.anno)}
            ${dato("Installato il", s.dataInstallazione ? fmtData(s.dataInstallazione) : "")}
            ${dato("Dove si trova", s.posizioneTesto)}${dato("Note", s.note)}
            ${spesa ? dato("Speso finora", fmtEuro(spesa)) : ""}
          </dl>
          ${!s.marca && !s.modello && !s.posizioneTesto ? `<p class="muted">Aggiungi marca, modello e dove si trova a bordo.</p>` : ""}
          <button class="btn blocco" data-act="modificaSistema" data-id="${id}" style="margin-top:12px">✏️ Modifica dati</button></div>

        <h2>Storico lavori (${storico.length})</h2>
        ${storico.length ? storico.map(i => cardIntervento(i, true)).join("") : `<div class="vuoto">Ancora nessun intervento registrato.</div>`}

        <button class="btn danger-ghost blocco" data-act="eliminaSistema" data-id="${id}" style="margin-top:30px">🗑️ Elimina questo sistema</button>`
    };
  };
}

function formIntervento(opz = {}){
  const esist = opz.id ? S.interventi.find(i => i.id === opz.id) : null;
  const f = esist ? clona(esist) : { sistemaId:opz.sistemaId || "", data:oggi(), tipo:"Manutenzione ordinaria", descrizione:opz.descrizione || "",
    chi:"fdt", officina:"", costo:"", ricambi:"", oreMotore:S.barca.oreMotore || "", fotoPrima:[], fotoDopo:[], statoDopo:"ok" };
  const nuove = [], daEliminare = [];
  let salvato = false;
  const apri = opz.sostituisci ? sostituisciTop : apriSheet;

      <label class="et" for="iData">Data</label><input class="campo" id="iData" type="date" value="${esc(f.data)}">

      <div class="scelta" id="iChi"><button type="button" data-c="fdt" class="${f.chi === "fdt" ? "on" : ""}">🙋 Fai da te</button><button type="button" data-c="off" class="${f.chi === "off" ? "on" : ""}">🏭 Officina / meccanico</button></div>
      <input class="campo" id="iOff" value="${esc(f.officina)}" placeholder="Nome officina o meccanico" style="margin-top:8px;${f.chi === "off" ? "" : "display:none"}">
      <div class="due">
        <div><label class="et" for="iCosto">Costo (€)</label><input class="campo" id="iCosto" type="number" inputmode="decimal" step="0.01" min="0" value="${esc(f.costo)}"></div>
        <div><label class="et" for="iOre">Ore motore</label><input class="campo" id="iOre" type="number" inputmode="decimal" step="0.1" value="${esc(f.oreMotore)}"></div>

      <label class="et">Foto prima</label><div id="iFP"></div><button type="button" class="btn blocco" data-f="fotoPrima">📷 Aggiungi foto “prima”</button>
      <label class="et">Foto dopo</label><div id="iFD"></div><button type="button" class="btn blocco" data-f="fotoDopo">📷 Aggiungi foto “dopo”</button>
      <label class="et">Dopo l'intervento il sistema è:</label>
      <div class="griglia-stati" id="iStato">${Object.keys(STATI).map(k => `<button type="button" class="st-${k} ${f.statoDopo === k ? "on" : ""}" data-s="${k}">${STATI[k].em} ${STATI[k].nome}</button>`).join("")}</div>
      <label class="check-riga" id="iAzzWrap"><input type="checkbox" id="iAzz" ${!esist && f.tipo !== "Guasto segnalato" && f.tipo !== "Riparazione" ? "checked" : ""}> Riparte da oggi il conto della manutenzione programmata</label>
      <div class="barra-salva"><button class="btn primary blocco" data-f="salva">Salva intervento</button>
        ${esist ? `<button class="btn danger-ghost blocco" data-f="elimina" style="margin-top:10px">🗑️ Elimina intervento</button>` : ""}</div>`,
    monta(el){
      const fotoBox = () => {
        $("#iFP", el).innerHTML = f.fotoPrima.length ? grigliaFoto(f.fotoPrima, "ivp") : "";
        $("#iFD", el).innerHTML = f.fotoDopo.length ? grigliaFoto(f.fotoDopo, "ivd") : "";
        idrataFoto(el);
      };
      const mostraAzz = () => {
        const s = trova($("#iSis", el).value), m = s && s.manutenzione;
        $("#iAzzWrap", el).style.display = m && (Number(m.mesi) || Number(m.ore)) ? "" : "none";
      };
      fotoBox(); mostraAzz();
      $("#iSis", el).addEventListener("change", mostraAzz);
      el.addEventListener("click", async e => {
        const t = e.target.closest("[data-t]"), c = e.target.closest("[data-c]"), st = e.target.closest("[data-s]"), fb = e.target.closest("[data-f]");
        if (t){ $$("#iTipo button", el).forEach(x => x.classList.toggle("on", x === t)); f.tipo = t.dataset.t;
          const statoAuto = f.tipo === "Guasto segnalato" ? "ko" : "ok"; f.statoDopo = statoAuto;
          $$("#iStato button", el).forEach(x => x.classList.toggle("on", x.dataset.s === statoAuto));
          $("#iAzz", el).checked = ["Manutenzione ordinaria", "Sostituzione", "Controllo"].includes(f.tipo) && !esist; }
        if (c){ $$("#iChi button", el).forEach(x => x.classList.toggle("on", x === c)); f.chi = c.dataset.c; $("#iOff", el).style.display = f.chi === "off" ? "" : "none"; }
        if (st){ $$("#iStato button", el).forEach(x => x.classList.toggle("on", x === st)); f.statoDopo = st.dataset.s; }
        if (fb && (fb.dataset.f === "fotoPrima" || fb.dataset.f === "fotoDopo")){
          const ids = await scegliFoto(); nuove.push(...ids); f[fb.dataset.f].push(...ids); fotoBox();
        }
        if (fb && fb.dataset.f === "salva") salvaIntervento(el);
        if (fb && fb.dataset.f === "elimina" && await conferma("Eliminare questo intervento dal registro?")){
          S.interventi = S.interventi.filter(i => i.id !== esist.id);
          await eliminaFoto([...esist.fotoPrima, ...esist.fotoDopo, ...nuove]).catch(() => {});
          salvato = true; salva(); chiudiTop(); toast("Intervento eliminato");
        }
      });
      // Foto dentro il modulo: tocco per vedere/eliminare
      el.addEventListener("click", e => {
        const b = e.target.closest("[data-act=vediFoto]"); if (!b) return;
        e.stopPropagation();
        const id = b.dataset.fotoId, lista = b.dataset.ctx === "ivp" ? f.fotoPrima : f.fotoDopo;
        apriVisore(id, () => { lista.splice(lista.indexOf(id), 1); daEliminare.push(id); fotoBox(); });
      }, true);
    }
  }), { allaChiusura(){ if (!salvato && nuove.length) eliminaFoto(nuove).catch(() => {}); } });

  function salvaIntervento(el){
    const v = x => $(x, el).value.trim();
    f.sistemaId = v("#iSis"); if (!f.sistemaId){ toast("Scegli il sistema"); $("#iSis", el).focus(); return; }
    f.data = v("#iData") || oggi(); f.descrizione = v("#iDescr"); f.officina = v("#iOff");
    f.costo = numOVuoto(v("#iCosto")); f.oreMotore = numOVuoto(v("#iOre")); f.ricambi = v("#iRic");
    const s = trova(f.sistemaId);
    if (esist) Object.assign(esist, f); else S.interventi.push(Object.assign({ id:uid() }, f));
    // Aggiorna lo stato del sistema solo se è l'intervento più recente
    const piuRecente = !S.interventi.some(i => i.sistemaId === s.id && i.data > f.data);
    if (piuRecente){ s.stato = f.statoDopo; if (!s.ultimaVerifica || f.data >= s.ultimaVerifica) s.ultimaVerifica = f.data; }
    if ($("#iAzz", el).checked && $("#iAzzWrap", el).style.display !== "none"){
      s.manutenzione.ultimaData = f.data; if (f.oreMotore !== "") s.manutenzione.ultimeOre = f.oreMotore;
    }
    if (f.oreMotore !== "" && f.oreMotore > (Number(S.barca.oreMotore) || 0)) aggiornaOre(f.oreMotore);
    if (opz.todoId){ const t = S.daFare.find(x => x.id === opz.todoId); if (t){ t.fatto = true; t.fattoIl = f.data; } }
    if (daEliminare.length) eliminaFoto(daEliminare).catch(() => {});
    salvato = true; salva(); chiudiTop(); toast("Intervento salvato ✓");
  }
}

/* =========================================================
   SINCRONIZZAZIONE CON GITHUB
   - I dati stanno nel file dati.json di un repository PRIVATO,
     le foto nella cartella foto/ dello stesso repository.
   - Ogni elemento (sistema, intervento, lavoro) porta l'ora
     dell'ultima modifica ("mod"). Quando due copie si incontrano,
     per ogni elemento vince la versione modificata per ultima.
   - Le cancellazioni sono registrate in "eliminati", così un
     telefono con la copia vecchia non le fa ricomparire.
   - Senza internet si lavora sul telefono; le modifiche restano
     in coda e partono appena torna la connessione.
   ========================================================= */
const CAMPI_BARCA = ["nome","tipo","lunghezza","modello","porto","oreDaEsempio"];
const TIPI_REC = ["sistemi","interventi","daFare"];
let snap = new Map();            // "firma" dell'ultimo stato salvato, per capire cosa è cambiato
let SY = null;                   // collegamento GitHub (solo su questo dispositivo, mai nei backup)
let syncStato = "off";           // off | ok | sync | offline | errore
let syncInCorso = false, syncDiNuovo = false, timerSync = null, fotoInCorso = false;

/* Testo confrontabile di un oggetto (chiavi in ordine) */
function stabile(v){
  if (Array.isArray(v)) return "[" + v.map(stabile).join(",") + "]";
  if (v && typeof v === "object") return "{" + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ":" + stabile(v[k])).join(",") + "}";
  return JSON.stringify(v === undefined ? null : v);
}
const firmaRec = r => { const o = Object.assign({}, r); delete o.mod; return stabile(o); };
function calcolaFirme(){
  const m = new Map();
  TIPI_REC.forEach(t => S[t].forEach(r => m.set(t + ":" + r.id, firmaRec(r))));
  m.set("barca", stabile(CAMPI_BARCA.map(k => S.barca[k] ?? "")));
  m.set("ore", String(S.barca.oreMotore));
  (S.barca.storicoOre || []).forEach(r => m.set("so:" + r.data, String(r.ore)));
  return m;
}
function fotografa(){ if (S) snap = calcolaFirme(); }
/* Segna l'ora sugli elementi cambiati dall'ultimo salvataggio; restituisce quanti */
function timbra(){
  const ora = Date.now(), nuove = calcolaFirme(); let n = 0;
  TIPI_REC.forEach(t => S[t].forEach(r => { const k = t + ":" + r.id; if (snap.get(k) !== nuove.get(k)){ r.mod = ora; n++; } }));
  if (snap.get("barca") !== nuove.get("barca")){ S.barca.mod = ora; n++; }
  if (snap.get("ore") !== nuove.get("ore")){ S.barca.oreMod = ora; n++; }
  (S.barca.storicoOre || []).forEach(r => { const k = "so:" + r.data; if (snap.get(k) !== nuove.get(k)){ r.mod = ora; n++; } });
  for (const k of snap.keys()){
    if (nuove.has(k) || k === "barca" || k === "ore") continue;
    S.eliminati[k.startsWith("so:") ? k : k.slice(k.indexOf(":") + 1)] = ora; n++;
  }
  snap = nuove; return n;
}
/* La parte dei dati che viene condivisa (le preferenze di aspetto restano locali) */
function forma(d){
  const b = {};
  CAMPI_BARCA.concat(["mod","oreMotore","oreMod","storicoOre"]).forEach(k => { if (d.barca && d.barca[k] !== undefined) b[k] = d.barca[k]; });
  return { barca:b, sistemi:d.sistemi || [], interventi:d.interventi || [], daFare:d.daFare || [], eliminati:d.eliminati || {} };
}
const estrai = () => clona(forma(S));
/* Unisce due copie dei dati elemento per elemento */
function unisci(L, R){
  const el = Object.assign({}, R.eliminati);
  Object.entries(L.eliminati).forEach(([k, v]) => { if (!(el[k] >= v)) el[k] = v; });
  const limite = Date.now() - 400 * 86400000;           // le cancellazioni più vecchie di 400 giorni si dimenticano
  Object.keys(el).forEach(k => { if (el[k] < limite) delete el[k]; });
  const U = { eliminati:el };
  TIPI_REC.forEach(t => {
    const m = new Map(); R[t].forEach(r => m.set(r.id, r));
    L[t].forEach(r => { const x = m.get(r.id); if (!x || (r.mod || 0) >= (x.mod || 0)) m.set(r.id, r); });
    U[t] = [...m.values()].filter(r => !(el[r.id] >= (r.mod || 0)));
  });
  const lb = L.barca, rb = R.barca;
  const info = (rb.mod || 0) > (lb.mod || 0) ? rb : lb, ore = (rb.oreMod || 0) > (lb.oreMod || 0) ? rb : lb;
  const so = new Map(); (rb.storicoOre || []).forEach(x => so.set(x.data, x));
  (lb.storicoOre || []).forEach(x => { const y = so.get(x.data); if (!y || (x.mod || 0) >= (y.mod || 0)) so.set(x.data, x); });
  U.barca = {};
  CAMPI_BARCA.forEach(k => { if (info[k] !== undefined) U.barca[k] = info[k]; });
  U.barca.mod = info.mod || 0; U.barca.oreMotore = ore.oreMotore ?? 0; U.barca.oreMod = ore.oreMod || 0;
  U.barca.storicoOre = [...so.values()].filter(x => !(el["so:" + x.data] >= (x.mod || 0))).sort((a, b) => a.data.localeCompare(b.data));
  return U;
}
/* Applica i dati uniti, riusando gli oggetti esistenti (così i moduli aperti restano validi) */
function applica(U){
  CAMPI_BARCA.forEach(k => { if (U.barca[k] !== undefined) S.barca[k] = U.barca[k]; else delete S.barca[k]; });
  ["mod","oreMotore","oreMod","storicoOre"].forEach(k => S.barca[k] = U.barca[k]);
  TIPI_REC.forEach(t => {
    const loc = new Map(S[t].map(r => [r.id, r]));
    S[t] = U[t].map(r => { const o = loc.get(r.id); if (!o) return r; Object.keys(o).forEach(k => { if (!(k in r)) delete o[k]; }); return Object.assign(o, r); });
  });
  S.eliminati = U.eliminati;
  normalizza(S); fotografa();
}

/* ---------- Chiamate a GitHub ---------- */
function salvaSY(){ if (SY) DB.scrivi("dati", "sync", SY).catch(() => {}); }
function programmaSync(ms){ if (!SY) return; clearTimeout(timerSync); timerSync = setTimeout(() => sincronizza(), ms); }
async function gh(metodo, percorso, corpo, cfg = SY){
  const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}` + (percorso ? "/" + percorso : "");
  try {
    return await fetch(url, { method:metodo, cache:"no-store",
      headers:Object.assign({ "Authorization":"Bearer " + cfg.token, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" }, corpo ? { "Content-Type":"application/json" } : {}),
      body: corpo ? JSON.stringify(corpo) : undefined });
  } catch(e){ const err = new Error("Nessuna connessione con GitHub"); err.offline = true; throw err; }
}
async function ghErrore(r){
  let m = ""; try { m = (await r.json()).message || ""; } catch(_){}
  if (r.status === 401) return new Error("Il token non è valido o è scaduto. Creane uno nuovo su GitHub e inseriscilo in “Modifica collegamento”.");
  if (r.status === 403) return new Error("GitHub ha rifiutato l'accesso: controlla che il token abbia il permesso “Contents: Read and write” su questo repository. (" + m + ")");
  if (r.status === 404) return new Error("Repository non trovato: controlla il nome (utente/nome) e che il token possa accedervi.");
  return new Error(`GitHub ha risposto con errore ${r.status}${m ? ": " + m : ""}`);
}
const percorsoFile = p => "contents/" + p.split("/").map(encodeURIComponent).join("/");
async function ghLeggiFile(p){
  const r = await gh("GET", percorsoFile(p) + "?ref=" + encodeURIComponent(SY.branch || "main"));
  if (r.status === 404) return null;
  if (!r.ok) throw await ghErrore(r);
  const j = await r.json();
  let b64 = j.content || "";
  if (!b64 && j.size > 0){                       // file oltre 1 MB: si legge in un altro modo
    const r2 = await gh("GET", "git/blobs/" + j.sha);
    if (!r2.ok) throw await ghErrore(r2);
    b64 = (await r2.json()).content || "";
  }
  return { sha:j.sha, b64:b64.replace(/\s/g, "") };
}
async function ghScriviFile(p, b64, sha, messaggio){
  const corpo = { message:messaggio, content:b64, branch:SY.branch || "main" };
  if (sha) corpo.sha = sha;
  const r = await gh("PUT", percorsoFile(p), corpo);
  if (r.status === 409 || r.status === 422){ const e = new Error("conflitto"); e.conflitto = true; throw e; }
  if (!r.ok) throw await ghErrore(r);
  return (await r.json()).content.sha;
}
async function ghEliminaFile(p, messaggio){
  const f = await ghLeggiFile(p); if (!f) return;
  const r = await gh("DELETE", percorsoFile(p), { message:messaggio, sha:f.sha, branch:SY.branch || "main" });
  if (!r.ok && r.status !== 404) throw await ghErrore(r);
}
function testoInB64(t){
  const by = new TextEncoder().encode(t); let s = "";
  for (let i = 0; i < by.length; i += 0x8000) s += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64InTesto(b){
  const s = atob(b), by = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) by[i] = s.charCodeAt(i);
  return new TextDecoder().decode(by);
}

/* ---------- La sincronizzazione vera e propria ---------- */
async function sincronizza(manuale){
  if (!SY || !SY.token || !S) return;
  if (syncInCorso){ syncDiNuovo = true; return; }
  if (!navigator.onLine){
    syncStato = "offline"; aggiornaIndicatore();
    if (manuale) toast("📴 Nessuna connessione. Le modifiche restano sul telefono e partono appena torna internet.");
    return;
  }
  syncInCorso = true; syncStato = "sync"; aggiornaIndicatore();
  let riuscita = false;
  try {
    for (let tentativo = 0; ; tentativo++){
      const remoto = await ghLeggiFile("dati.json");
      let datiR = null;
      if (remoto){
        try { const j = JSON.parse(b64InTesto(remoto.b64)); datiR = forma(j.dati || j); }
        catch(e){ throw new Error("Il file dati.json su GitHub è danneggiato. Ripristina un backup oppure eliminalo da GitHub."); }
      }
      // Da qui fino all'applicazione non ci sono attese: nessuna modifica può andare persa
      salvaOra();
      const inAttesa = SY.modifiche || 0, prima = stabile(forma(S));
      applica(datiR ? unisci(estrai(), clona(datiR)) : estrai());
      const unito = estrai();
      if (stabile(unito) !== prima){ DB.scrivi("dati", "stato", S).catch(erroreMemoria); aggiornaTutto(); }
      if (!datiR || stabile(unito) !== stabile(datiR)){
        const testo = JSON.stringify({ app:"diario-bordo-barca", versione:1, aggiornato:new Date().toISOString(), da:SY.dispositivo || "", dati:unito }, null, 1);
        try { await ghScriviFile("dati.json", testoInB64(testo), remoto && remoto.sha, `Aggiornamento da ${SY.dispositivo || "dispositivo"} (${fmtData(oggi())})`); }
        catch(e){ if (e.conflitto && tentativo < 5) continue; throw e; }   // qualcun altro ha appena scritto: rileggo e riunisco
      }
      SY.modifiche = Math.max(0, (SY.modifiche || 0) - inAttesa);
      break;
    }
    SY.ultimaSync = Date.now(); SY.ultimoErrore = ""; salvaSY();
    syncStato = "ok"; riuscita = true;
    if (manuale) toast("☁️ Sincronizzato ✓");
  } catch(e){
    if (e.offline){ syncStato = "offline"; if (manuale) toast("📴 GitHub non è raggiungibile. Riprovo appena torna la connessione."); }
    else { syncStato = "errore"; SY.ultimoErrore = e.message; salvaSY(); if (manuale) avviso("⚠️ Sincronizzazione non riuscita.<br>" + esc(e.message)); }
  } finally {
    syncInCorso = false; aggiornaIndicatore();
    if (riuscita){
      sincronizzaFoto();
      if (syncDiNuovo || SY && SY.modifiche){ syncDiNuovo = false; programmaSync(2000); }
    }
  }
}

/* ---------- Foto ---------- */
function fotoUsate(){
  const u = new Set();
  S.sistemi.forEach(x => x.foto.forEach(i => u.add(i)));
  S.interventi.forEach(x => x.fotoPrima.concat(x.fotoDopo).forEach(i => u.add(i)));
  return u;
}
function eliminaFoto(ids){
  ids = (ids || []).filter(Boolean); if (!ids.length) return Promise.resolve();
  ids.forEach(id => fotoCache.delete(id));
  if (SY){
    const inv = new Set(SY.fotoInviate || []), coda = new Set(SY.fotoDaEliminare || []);
    ids.forEach(id => { if (inv.has(id)){ inv.delete(id); coda.add(id); } });
    SY.fotoInviate = [...inv]; SY.fotoDaEliminare = [...coda]; salvaSY();
  }
  return DB.elimina("foto", ids);
}
async function scaricaFoto(id){
  if (!SY || !navigator.onLine) return null;
  try {
    const f = await ghLeggiFile(`foto/${id}.jpg`); if (!f) return null;
    const d = "data:image/jpeg;base64," + f.b64;
    await DB.scrivi("foto", id, d); fotoCache.set(id, d);
    if (!(SY.fotoInviate || []).includes(id)){ SY.fotoInviate = (SY.fotoInviate || []).concat(id); salvaSY(); }
    return d;
  } catch(_){ return null; }
}
async function sincronizzaFoto(){
  if (fotoInCorso || !SY || !S) return; fotoInCorso = true;
  try {
    for (const id of (SY.fotoDaEliminare || []).slice()){
      await ghEliminaFile(`foto/${id}.jpg`, "Foto eliminata");
      SY.fotoDaEliminare = SY.fotoDaEliminare.filter(x => x !== id); salvaSY();
    }
    const locali = await DB.chiavi("foto");
    for (const id of fotoUsate()){
      if (!SY) break;
      if ((SY.fotoInviate || []).includes(id) || !locali.has(id)) continue;
      const d = await DB.leggi("foto", id); if (!d) continue;
      try { await ghScriviFile(`foto/${id}.jpg`, d.split(",")[1], null, "Nuova foto"); }
      catch(e){ if (!e.conflitto) throw e; }          // già presente su GitHub
      SY.fotoInviate = (SY.fotoInviate || []).concat(id); salvaSY();
    }
    for (const id of fotoUsate()){
      if (!SY) break;
      if (!locali.has(id) && await scaricaFoto(id)) idrataFoto(document);
    }
  } catch(_){ /* riprova alla prossima sincronizzazione */ }
  finally { fotoInCorso = false; }
}

/* ---------- Indicatore e pannello ---------- */
function fmtDataOra(ms){
  if (!ms) return "mai";
  const d = new Date(ms);
  return d.toLocaleDateString("it-IT", { day:"numeric", month:"short" }) + " alle " + d.toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit" });
}
function testoSyncLungo(){
  const n = SY ? SY.modifiche || 0 : 0;
  if (syncStato === "sync") return "🔄 Sincronizzazione in corso…";
  if (syncStato === "offline") return n ? `📴 Senza connessione: ${n} ${n === 1 ? "modifica salvata" : "modifiche salvate"} sul telefono, partono appena torna internet.` : "📴 Senza connessione. Tutto è salvato sul telefono.";
  if (syncStato === "errore") return "⚠️ L'ultima sincronizzazione non è riuscita.";
  return n ? `⏳ ${n} ${n === 1 ? "modifica" : "modifiche"} da inviare` : "☁️ Tutto sincronizzato";
}
function aggiornaIndicatore(){
  const el = $("#syncChip");
  if (el && SY){
    const n = SY.modifiche || 0;
    el.textContent = syncStato === "sync" ? "🔄" : syncStato === "offline" ? (n ? `📴 ${n}` : "📴") : syncStato === "errore" ? "⚠️" : n ? `⏳ ${n}` : "☁️ ✓";
    el.classList.toggle("errore", syncStato === "errore");
    el.setAttribute("aria-label", "Sincronizzazione: " + testoSyncLungo());
  }
  sheets.filter(sh => sh.opts.sync).forEach(disegnaSheet);
}
function apriSync(){ if (SY) apriSheet(schedaSync, { sync:true }); else apriSheet(formSync); }
function schedaSync(){
  if (!SY) return null;
  return { titolo:"☁️ Sincronizzazione", html:`
    <div class="card"><div style="font-size:21px;font-weight:700">${testoSyncLungo()}</div>
      ${syncStato === "errore" && SY.ultimoErrore ? `<p class="muted" style="margin-top:8px">${esc(SY.ultimoErrore)}</p>` : ""}
      <dl class="dati" style="margin-top:12px">
        <dt>Ultima volta</dt><dd>${fmtDataOra(SY.ultimaSync)}</dd>
        <dt>Repository</dt><dd>${esc(SY.owner + "/" + SY.repo)}</dd>
        <dt>Questo dispositivo</dt><dd>${esc(SY.dispositivo || "—")}</dd>
        ${(SY.fotoDaEliminare || []).length ? `<dt>Foto da eliminare</dt><dd>${SY.fotoDaEliminare.length}</dd>` : ""}
      </dl></div>
    <button class="btn primary blocco" data-act="syncOra" ${syncStato === "sync" ? "disabled" : ""}>🔄 Sincronizza ora</button>
    <p class="muted piccolo" style="margin-top:12px">L'app si sincronizza da sola: quando si apre, poco dopo ogni modifica e ogni tre minuti. Senza internet tutto viene salvato sul telefono e inviato appena torna la connessione.</p>
    <div class="fila" style="margin-top:20px"><button class="btn" data-act="configSync">⚙️ Modifica collegamento</button>
      <button class="btn danger-ghost" data-act="scollegaSync">Scollega</button></div>` };
}
function formSync(){
  const c = SY || {};
  return { titolo:"Collega a GitHub", html:`
    <p>Inserisci il repository <b>privato</b> dove salvare i dati e il token di accesso. Si fa una volta sola su ogni telefono o PC.</p>
    <label class="et" for="gRepo">Repository</label>
    <input class="campo" id="gRepo" value="${esc(c.owner ? c.owner + "/" + c.repo : "")}" placeholder="utente/barca-dati" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label class="et" for="gTok">Token di accesso</label>
    <input class="campo" id="gTok" type="password" value="${esc(c.token || "")}" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label class="et" for="gDisp">Nome di questo dispositivo</label>
    <input class="campo" id="gDisp" value="${esc(c.dispositivo || "")}" placeholder="es. Telefono papà">
    <div class="barra-salva"><button class="btn primary blocco" data-f="collega">Collega e sincronizza</button></div>
    <p class="muted piccolo">Il token resta salvato solo su questo dispositivo e non finisce mai nei file di backup.</p>`,
    monta(el){ $("[data-f=collega]", el).addEventListener("click", () => collegaGitHub(el)); } };
}
async function collegaGitHub(el){
  const btn = $("[data-f=collega]", el);
  const rep = $("#gRepo", el).value.trim().replace(/^https?:\/\/(www\.)?github\.com\//i, "").replace(/\.git$/, "").replace(/\/+$/, "");
  const parti = rep.split("/"), token = $("#gTok", el).value.trim(), disp = $("#gDisp", el).value.trim();
  if (parti.length !== 2 || !parti[0] || !parti[1]){ toast("Scrivi il repository come utente/nome, es. mario/barca-dati"); return; }
  if (!token){ toast("Incolla il token di accesso"); return; }
  const ripristina = () => { btn.disabled = false; btn.textContent = "Collega e sincronizza"; };
  btn.disabled = true; btn.textContent = "Controllo il collegamento…";
  const prova = { owner:parti[0], repo:parti[1], token, dispositivo:disp };
  try {
    const r = await gh("GET", "", null, prova);
    if (!r.ok) throw await ghErrore(r);
    const info = await r.json();
    if (info.private === false && !await conferma("⚠️ Questo repository è <b>pubblico</b>: chiunque potrebbe vedere i dati e le foto della barca.<br>Rendilo privato da GitHub prima di continuare.", "Continua comunque")){ ripristina(); return; }
    prova.branch = info.default_branch || "main";
    const stesso = SY && SY.owner === prova.owner && SY.repo === prova.repo;
    SY = Object.assign(stesso ? SY : { modifiche:S.sistemi.length + S.interventi.length + S.daFare.length, fotoInviate:[], fotoDaEliminare:[], ultimaSync:0 }, prova);
    salvaSY(); chiudiTop(); aggiornaTutto();
    await sincronizza(true);
  } catch(e){
    avviso("Collegamento non riuscito.<br>" + esc(e.message)); ripristina();
  }
}

/* =========================================================
   AZIONI (tutti i tocchi passano da qui)
   ========================================================= */
const AZ = {
  vai(el){ vista = el.dataset.v; modoSposta = false; while (sheets.length){ const sh = sheets.pop(); sh.el.remove(); } aggiornaVelo(); renderTutto(); window.scrollTo(0, 0); if (vista === "impostazioni") mostraSpazio(); },
  disegno(el){ vistaDisegno = el.dataset.v; renderMain(); },
  filtraStato(el){ filtroStato = filtroStato === el.dataset.v ? "tutti" : el.dataset.v; if (el.dataset.v === "tutti") filtroStato = "tutti";
    if (vista !== "barca"){ vista = "barca"; renderNav(); } renderMain(); },
  sposta(){ modoSposta = !modoSposta; if (modoSposta) filtroStato = "tutti"; renderMain(); if (!modoSposta) toast("Posizioni salvate ✓"); },
  catalogo(){ apriCatalogo(); },
  aggiungiCat(el){ aggiungiDaCatalogo(el.dataset.cat, el.dataset.id); },
  personalizzato(){ formSistema(null, true); },
  scheda(el){ apriScheda(el.dataset.id); },
  chiudi(){ chiudiTop(); },
  verificato(el){ const s = trova(el.dataset.id); s.stato = "ok"; s.ultimaVerifica = oggi(); salva(); aggiornaTutto(); toast("Segnato come verificato oggi ✓"); },
  setStato(el){ const s = trova(el.dataset.id); s.stato = el.dataset.v; s.ultimaVerifica = oggi(); salva(); aggiornaTutto(); toast(`Stato: ${STATI[el.dataset.v].nome}`); },
  nuovoIntervento(el){ if (!S.sistemi.length){ toast("Prima aggiungi un sistema alla barca"); return; } formIntervento({ sistemaId:el.dataset.id }); },
  apriIntervento(el){ formIntervento({ id:el.dataset.id }); },
  nuovoTodo(el){ formTodo({ sistemaId:el.dataset.id }); },
  apriTodo(el){ formTodo({ id:el.dataset.id }); },
  todoFatto(el){ const t = S.daFare.find(x => x.id === el.dataset.id); if (t) completaTodo(t, false); },
  todoRiapri(el){ const t = S.daFare.find(x => x.id === el.dataset.id); if (t){ t.fatto = false; delete t.fattoIl; salva(); aggiornaTutto(); } },
  modificaSistema(el){ formSistema(el.dataset.id); },
  async eliminaSistema(el){
    const s = trova(el.dataset.id); const iv = S.interventi.filter(i => i.sistemaId === s.id);
    if (!await conferma(`Eliminare <b>${esc(s.nome)}</b>?${iv.length ? `<br>Verranno eliminati anche ${iv.length} interventi del registro.` : ""}<br>Le foto verranno cancellate.`)) return;
    const foto = [...s.foto, ...iv.flatMap(i => [...i.fotoPrima, ...i.fotoDopo])];
    S.sistemi = S.sistemi.filter(x => x.id !== s.id);
    S.interventi = S.interventi.filter(i => i.sistemaId !== s.id);
    S.daFare = S.daFare.filter(t => t.sistemaId !== s.id);
    eliminaFoto(foto).catch(() => {}); salva(); chiudiTop(); toast("Sistema eliminato");
  },
  async fotoSistema(el){ const s = trova(el.dataset.id); const ids = await scegliFoto(); if (ids.length){ s.foto.push(...ids); salva(); aggiornaTutto(); toast("Foto salvata ✓"); } },
  vediFoto(el){
    const id = el.dataset.fotoId, ctx = el.dataset.ctx || "";
    if (ctx.startsWith("sis:")){
      const s = trova(ctx.slice(4));
      apriVisore(id, () => { s.foto = s.foto.filter(x => x !== id); eliminaFoto([id]).catch(() => {}); salva(); aggiornaTutto(); });
    } else apriVisore(id, null);
  },
  oreQuick(el){ const i = $("#oreNuove"); i.value = Math.round(((Number(i.value) || 0) + Number(el.dataset.v)) * 10) / 10; },
  async salvaOre(){
    const n = Number($("#oreNuove").value);
    if ($("#oreNuove").value === "" || isNaN(n) || n < 0){ toast("Scrivi le ore del contaore"); return; }
    if (n < (Number(S.barca.oreMotore) || 0) && !await conferma(`Le ore inserite (${fmtOre(n)}) sono meno di quelle salvate (${fmtOre(S.barca.oreMotore)}).<br>Vuoi correggerle?`, "Sì, correggi", "primary")) return;
    aggiornaOre(n); salva(); document.activeElement.blur(); aggiornaTutto(); toast("Ore motore salvate ✓");
  },
  esporta(){ esportaBackup(false); },
  condividi(){ esportaBackup(true); },
  importa(){ $("#fileBackup").click(); },
  stampa(){ stampaRegistro(); },
  bTipo(el){ S.barca.tipo = el.dataset.v; salva(); aggiornaTutto(); },
  salvaBarca(){
    S.barca.nome = $("#bNome").value.trim(); S.barca.lunghezza = Number($("#bLung").value) || S.barca.lunghezza;
    S.barca.porto = $("#bPorto").value.trim(); S.barca.modello = $("#bModello").value.trim();
    salva(); aggiornaTutto(); toast("Dati della barca salvati ✓");
  },
  tema(el){ S.ui.tema = el.dataset.v; applicaTema(); salva(); renderMain(); },
  async cancellaEsempio(){
    if (!await conferma("Cancellare i dati di esempio?<br>I sistemi e gli interventi inseriti da te restano.", "Cancella esempi")) return;
    const ids = new Set(S.sistemi.filter(s => s.esempio).map(s => s.id));
    const foto = S.sistemi.filter(s => s.esempio).flatMap(s => s.foto);
    S.sistemi = S.sistemi.filter(s => !s.esempio);
    S.interventi = S.interventi.filter(i => !i.esempio && !ids.has(i.sistemaId));
    S.daFare = S.daFare.filter(t => !t.esempio && !ids.has(t.sistemaId));
    S.barca.storicoOre = (S.barca.storicoOre || []).filter(r => !r.esempio);
    if (S.barca.oreDaEsempio){ S.barca.oreMotore = S.barca.storicoOre.length ? S.barca.storicoOre[S.barca.storicoOre.length - 1].ore : 0; delete S.barca.oreDaEsempio; }
    eliminaFoto(foto).catch(() => {}); salva(); aggiornaTutto(); toast("Dati di esempio cancellati ✓");
  },
  async cancellaTutto(){
    if (!await conferma("Cancellare <b>tutti</b> i dati di questa app?<br>Sistemi, interventi, foto e impostazioni verranno eliminati da questo telefono.", "Sì, cancella tutto")) return;
    if (!await conferma(`Ultima conferma: l'operazione non si può annullare.${SY ? "<br>I dati su GitHub non vengono toccati: questo dispositivo viene solo scollegato." : ""}`, "Cancella definitivamente")) return;
    await DB.svuota("foto").catch(() => {}); await DB.svuota("dati").catch(() => {});
    clearTimeout(timerSync); SY = null; syncStato = "off";
    fotoCache.clear(); S = null; vista = "barca"; renderTutto();
  },
  apriSync(){ apriSync(); },
  syncOra(){ sincronizza(true); },
  configSync(){ apriSheet(formSync); },
  async scollegaSync(){
    if (!await conferma("Scollegare questo dispositivo da GitHub?<br>I dati restano sia qui sia su GitHub: smettono solo di sincronizzarsi.", "Scollega")) return;
    clearTimeout(timerSync); SY = null; syncStato = "off";
    await DB.elimina("dati", ["sync"]).catch(() => {});
    chiudiTop(); toast("Dispositivo scollegato");
  },
  collegaNuovo(){
    S = normalizza({ barca:{ nome:"", tipo:tipoBenvenuto, lunghezza:10 } });
    fotografa(); salvaOra(); vista = "barca"; renderTutto(); apriSheet(formSync);
  },
  wTipo(el){ tipoBenvenuto = el.dataset.v; $$(".benvenuto .seg button").forEach(b => b.classList.toggle("on", b.dataset.v === tipoBenvenuto)); },
  avvia(el){
    S = normalizza({ barca:{ nome:$("#wNome").value.trim() || (el.dataset.v === "esempio" ? "Stella Marina" : "La mia barca"),
      tipo:tipoBenvenuto, lunghezza:Number($("#wLung").value) || 10 } });
    fotografa();
    if (el.dataset.v === "esempio") datiEsempio();
    salva(); vista = "barca"; renderTutto();
    if (el.dataset.v === "zero") setTimeout(() => toast("Tocca “+ Aggiungi sistema” per iniziare"), 300);
  }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const f = AZ[el.dataset.act]; if (f){ e.preventDefault(); f(el, e); }
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-chg]"); if (!el) return;
  const k = el.dataset.chg;
  if (k === "filtroCat"){ filtroCat = el.value; renderMain(); }
  if (k === "nomi"){ S.ui.nomi = el.checked; salva(); renderMain(); }
  if (k === "regSistema"){ filtriReg.sistema = el.value; renderMain(); }
  if (k === "regAnno"){ filtriReg.anno = el.value; renderMain(); }
  if (k === "regTipo"){ filtriReg.tipo = el.value; renderMain(); }
});

/* =========================================================
   TEMA, ICONA E AVVIO
   ========================================================= */
function applicaTema(){
  const t = S && S.ui ? S.ui.tema : "auto";
  if (t === "chiaro") document.documentElement.dataset.theme = "light";
  else if (t === "scuro") document.documentElement.dataset.theme = "dark";
  else delete document.documentElement.dataset.theme;
}
/* Disegna l'icona dell'app (per la schermata Home) */
function creaIcona(){
  try {
    const c = document.createElement("canvas"); c.width = c.height = 192; const x = c.getContext("2d");
    x.fillStyle = "#0b2545"; x.fillRect(0, 0, 192, 192);
    x.fillStyle = "#e6d3a3"; x.fillRect(0, 140, 192, 52);
    x.font = "110px serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("⚓", 96, 86);
    const url = c.toDataURL("image/png");
    $("#appleIcon").href = url; $("#favIcon").href = url;
    const man = { name:"Diario di bordo", short_name:"Barca", start_url:location.href.split("#")[0], display:"standalone",
      background_color:"#0b2545", theme_color:"#0b2545", icons:[{ src:url, sizes:"192x192", type:"image/png" }] };
    $("#manifestLink").href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(man));
  } catch(_){}
}
async function avvio(){
  creaIcona();
  try { await DB.apri(); S = await DB.leggi("dati", "stato") || null; }
  catch(e){ S = null; setTimeout(() => avviso("⚠️ Questo browser non permette di salvare i dati (forse sei in navigazione privata). Puoi provare l'app, ma alla chiusura i dati si perdono."), 500); }
  if (S) normalizza(S);
  try { SY = await DB.leggi("dati", "sync") || null; } catch(_){ SY = null; }
  if (SY) syncStato = navigator.onLine ? "ok" : "offline";
  fotografa();
  applicaTema(); renderTutto();
  if (SY && S) setTimeout(() => sincronizza(), 600);
  window.addEventListener("online", () => sincronizza());
  window.addEventListener("offline", () => { if (SY){ syncStato = "offline"; aggiornaIndicatore(); } });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden"){ if (S) salvaOra(); return; }
    if (SY && Date.now() - (SY.ultimaSync || 0) > 30000) sincronizza();
  });
  setInterval(() => { if (document.visibilityState === "visible") sincronizza(); }, 180000);
  // Chiede al browser di non cancellare i dati per liberare spazio
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  // Funzionamento offline completo quando l'app è pubblicata su un sito (serve il file sw.js accanto)
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
}
avvio();
</script>
